<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gutschein</title>
  <meta name="description" content="Ein interaktiver Gutschein mit Bild auf der Vorderseite und Text auf der Rückseite.">
  <style>
    :root {
      --page-top: #efe4d3;
      --page-bottom: #d9e4d2;
      --shadow: 0 28px 70px rgba(64, 46, 30, 0.22);
      --hint-bg: rgba(255, 250, 242, 0.82);
      --hint-text: #6e5038;
      --paper-base: #f8f1e6;
      --paper-accent: #c76c3e;
      --paper-accent-soft: rgba(199, 108, 62, 0.12);
      --paper-text: #35241b;
      --paper-muted: #655349;
      --wash-blue: rgba(87, 123, 212, 0.26);
      --wash-violet: rgba(169, 135, 213, 0.2);
      --wash-gold: rgba(231, 182, 72, 0.28);
      --wash-red: rgba(205, 92, 59, 0.22);
      --line: rgba(104, 70, 46, 0.16);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(255, 248, 238, 0.9), transparent 28%),
        radial-gradient(circle at bottom right, rgba(172, 196, 160, 0.5), transparent 25%),
        linear-gradient(160deg, var(--page-top), var(--page-bottom));
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--paper-text);
    }

    .stage {
      width: min(100%, 920px);
      perspective: 1800px;
    }

    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.2, 0.75, 0.2, 1);
      border-radius: var(--radius);
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card:focus-visible {
      outline: 3px solid rgba(201, 122, 75, 0.5);
      outline-offset: 6px;
    }

    .card-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--radius);
      backface-visibility: hidden;
      box-shadow: var(--shadow);
    }

    .card-front {
      background: #f7efe5;
    }

    .card-front img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--hint-bg);
      color: var(--hint-text);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      box-shadow: 0 8px 18px rgba(72, 49, 30, 0.12);
    }

    .card-back {
      transform: rotateY(180deg);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background:
        radial-gradient(circle at 18% 26%, var(--wash-red), transparent 24%),
        radial-gradient(circle at 72% 22%, var(--wash-blue), transparent 26%),
        radial-gradient(circle at 86% 64%, var(--wash-gold), transparent 28%),
        radial-gradient(circle at 36% 86%, var(--wash-violet), transparent 24%),
        linear-gradient(145deg, #f8f2e9, #f2e3ca 54%, #edd8ba);
      border: 1px solid rgba(134, 88, 53, 0.12);
    }

    .card-back::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.38), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.22)),
        linear-gradient(0deg, rgba(255, 255, 255, 0.2), transparent 42%),
        repeating-linear-gradient(
          0deg,
          rgba(104, 70, 46, 0.028) 0 2px,
          rgba(255, 255, 255, 0) 2px 6px
        );
      pointer-events: none;
    }

    .card-back::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 22px;
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .back-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: clamp(28px, 5vw, 54px);
      text-align: left;
    }

    .eyebrow {
      display: inline-block;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 250, 245, 0.62);
      color: var(--paper-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(199, 108, 62, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4.4rem);
      line-height: 0.92;
      font-weight: 700;
      max-width: 8ch;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .message {
      max-width: 30rem;
      margin: 0;
      color: var(--paper-muted);
      font-size: clamp(1rem, 1.8vw, 1.16rem);
      line-height: 1.75;
      padding-left: 18px;
      border-left: 3px solid rgba(199, 108, 62, 0.28);
    }

    .signature {
      margin-top: 4px;
      color: var(--paper-text);
      font-size: 1.04rem;
      font-style: italic;
    }

    .flip-note {
      position: absolute;
      right: clamp(18px, 4vw, 34px);
      bottom: clamp(18px, 4vw, 30px);
      color: rgba(62, 42, 29, 0.68);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 248, 239, 0.46);
      backdrop-filter: blur(6px);
    }

    .back-content::after {
      content: "";
      position: absolute;
      top: clamp(22px, 4vw, 32px);
      right: clamp(26px, 5vw, 44px);
      width: 120px;
      height: 120px;
      border-radius: 999px;
      background:
        radial-gradient(circle at center, rgba(255, 252, 247, 0.78), rgba(255, 255, 255, 0) 62%);
      opacity: 0.65;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .stage {
        width: 100%;
      }

      .card {
        aspect-ratio: 4 / 5;
      }

      .hint {
        left: 14px;
        right: 14px;
        bottom: 14px;
        text-align: left;
      }

      .back-content {
        justify-content: flex-start;
        padding-top: 36px;
      }

      .message {
        padding-left: 14px;
      }

      .flip-note {
        position: static;
        margin-top: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <button class="card" id="card" type="button" aria-pressed="false" aria-label="Gutschein umdrehen">
      <section class="card-face card-front" aria-hidden="false">
        <img src="./guschein.png" alt="Gutscheinbild">
        <div class="hint">Zum Öffnen klicken</div>
      </section>

      <section class="card-face card-back" aria-hidden="true">
        <div class="back-content">
          <span class="eyebrow">Gutschein</span>
          <h1>Für dich.</h1>
          <p class="message">
            Dieser Gutschein ist für einen gemeinsamen Ausflug, ein feines Essen
            oder etwas anderes Schönes gedacht, das wir zusammen auswählen.
          </p>
          <p class="signature">Mit Liebe</p>
          <div class="flip-note">Nochmal klicken zum Zurückdrehen</div>
        </div>
      </section>
    </button>
  </main>

  <script>
    const card = document.getElementById("card");

    card.addEventListener("click", () => {
      const isFlipped = card.classList.toggle("is-flipped");
      card.setAttribute("aria-pressed", String(isFlipped));
    });
  </script>
</body>
</html>
